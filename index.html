<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 'DM Sans',system-ui,sans-serif;min-height:100%}
#pf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
header,main{position:relative;z-index:1}

button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .2s}

.pg i{flex:1;height:6px;border-radius:9px;background:var(--ln);overflow:hidden}.pg u{display:block;height:100%;background:linear-gradient(90deg,#f4a6c0,#ffd25a,#3fd0c0,#9a6be0);transition:width .6s}
main{max-width:780px;margin:0 auto;padding:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px;font-size:14px;color:var(--mu)}
#tw{display:flex;flex-direction:column;align-items:center;gap:5px}
.roof{width:34%;height:38px;clip-path:polygon(50% 0,100% 100%,0 100%);transition:.6s;animation:pop .6s both}
.fl{position:relative;display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border:0;border-radius:10px;background:color-mix(in srgb,var(--c) 30%,var(--card));color:var(--fg);text-align:left;min-width:250px;animation:rise .5s both;animation-delay:calc(var(--k)*25ms)}
.fl:hover{transform:scale(1.03);box-shadow:0 6px 22px color-mix(in srgb,var(--c) 45%,transparent)}
.fl.dn{background:var(--c);color:var(--t);box-shadow:0 0 16px var(--c),0 0 40px color-mix(in srgb,var(--c) 55%,transparent);animation:rise .5s both,glow 3s ease-in-out infinite;animation-delay:calc(var(--k)*25ms),0s}
.fl .n{font-size:13px;opacity:.7;width:24px}.fl b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl em{font-style:normal;font-size:12px;opacity:.75}
.fl .ck{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:#0a8a3a;display:none;place-items:center;font-weight:700;animation:pop .5s both}.fl.dn .ck{display:grid}
.fl .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}.fl.dn .sw{display:none}
.base{width:100%;height:12px;margin-top:6px;border-radius:4px;background:var(--ln)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes glow{50%{box-shadow:0 0 26px var(--c),0 0 60px color-mix(in srgb,var(--c) 70%,transparent)}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#ov.on{display:flex}
#dg{background:var(--card);width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;border-radius:16px;animation:pop .3s both}
#dg .hd{display:flex;justify-content:space-between;gap:12px;padding:16px}#dg h2{margin:0;font-size:22px}#dg .hd p{margin:2px 0 0;font-size:14px;opacity:.85}
#dg .x{background:transparent;border-color:currentColor;padding:2px 10px;height:32px}
#sc{width:100%;display:block;aspect-ratio:3/2;background:#0b0d12}
#dg section{padding:12px 16px}#dg h3{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.05em}#dg p{margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:2px 10px;font-size:14px;animation:pop .4s both}
.ft{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:14px 16px;border-top:1px solid var(--ln);align-items:center}
.ai{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}.ai:empty{display:none}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;width:100%;margin-bottom:8px}
#rt{display:none;text-align:center}#rt.on{display:block}

#st2{display:flex;gap:10px;position:absolute;top:12px;left:0;will-change:transform}
.rc{flex:0 0 140px;height:126px;border-radius:10px;background:var(--c);color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;padding:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}.rc small{font-weight:400;opacity:.8}
.rc.w{outline:3px solid #ffd25a}
#res{min-height:60px;animation:pop .4s both}
@media(max-width:640px){#ov{align-items:flex-end;padding:0}#dg{border-radius:16px 16px 0 0;max-height:92%}.fl em{display:none}.fl{min-width:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#sc2{width:100%;display:block;aspect-ratio:72/40;image-rendering:pixelated;background:#0b0d12}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.mc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;animation:rise .4s both}
#dg .mc{background:var(--bg)}.mc img{image-rendering:pixelated;width:40px;height:40px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}.mc b{display:block;font-size:15px}.mc small{color:var(--mu)}
.fl:after{content:"";position:absolute;inset:0;border-radius:10px;background:#fff;opacity:0;pointer-events:none}.fl.wv:after{animation:wv .7s var(--wd) both}@keyframes wv{30%{opacity:.6}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0}#fx.on{animation:fxa .8s}@keyframes fxa{0%{opacity:.85}100%{opacity:0}}
.pp{position:fixed;z-index:40;font-weight:700;font-size:22px;pointer-events:none;color:#ffd25a;text-shadow:0 2px 10px #000;animation:fl 1.6s both;transform:translate(-50%,-50%);white-space:nowrap}@keyframes fl{to{transform:translate(-50%,-220%);opacity:0}}
main.shk{animation:sk .4s}@keyframes sk{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,2px)}}
.rc.w{animation:pop .5s .1s both,glow 1.5s infinite}
/* ===== Macro mejoras ===== */
#rt{position:relative}
#towerBuild{margin:18px auto 0;min-height:240px;max-height:520px;border:1px solid var(--ln);border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,transparent),var(--bg));padding:18px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.08) inset}
#towerBuild .bt-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
#towerBuild .bt-stack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;min-height:185px;justify-content:flex-start}
#towerBuild .bt-floor{width:min(92%,520px);height:34px;border:1px solid color-mix(in srgb,var(--c),#000 18%);border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 92%,#000 8%),color-mix(in srgb,var(--c) 70%,#fff 30%));color:var(--t);box-shadow:0 5px 14px color-mix(in srgb,var(--c) 25%,transparent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;position:relative;overflow:hidden;transform-origin:center bottom}
#towerBuild .bt-floor:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 35%,rgba(255,255,255,.28) 48%,transparent 61%);transform:translateX(-120%);animation:buildshine 1.1s ease-out forwards}
#towerBuild .bt-floor.new{animation:floorIn .7s cubic-bezier(.2,.9,.2,1) both}

#towerBuild .bt-floor .bt-dot{position:absolute;right:10px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 12px rgba(255,255,255,.6)}
@keyframes floorIn{0%{opacity:0;transform:translateY(-120px) scale(.82);filter:blur(5px)}55%{opacity:1;transform:translateY(10px) scale(1.03);filter:blur(0)}75%{transform:translateY(-3px) scale(.995)}100%{transform:translateY(0) scale(1)}}
@keyframes buildshine{to{transform:translateX(120%)}}
#towerBuild .bt-empty{display:grid;place-items:center;min-height:180px;color:var(--mu);text-align:center}
#towerBuild .bt-empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}
#res{min-height:72px}
#res .resultCard{display:grid;gap:8px;place-items:center;text-align:center;padding:8px 10px 2px}
#res .resultCard h2{margin:0}
#res .resultActions{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
#res .accept{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 6px 20px rgba(0,0,0,.18)}
#res .accept:hover{box-shadow:0 10px 30px rgba(0,0,0,.22)}
#trk{height:176px}
#st2{top:19px}
.rc{height:138px;transition:transform .2s,box-shadow .25s,filter .25s}
.rc.spinning{filter:saturate(.88) brightness(.97)}
.rc.mystery{background:linear-gradient(135deg,#303640,#646c78);border-color:#87909c;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22)}
.rc.win{outline:3px solid #ffd25a;box-shadow:0 0 0 6px rgba(255,210,90,.12),0 0 28px #ffd25a,inset 0 -6px 0 rgba(0,0,0,.2);transform:translateY(-5px) scale(1.03);animation:winPop .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes winPop{0%{opacity:.75;transform:translateY(3px) scale(.92)}60%{transform:translateY(-8px) scale(1.06)}100%{opacity:1;transform:translateY(-5px) scale(1.03)}}
#sc{background:#090c12;image-rendering:pixelated;cursor:default}
.planLegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.planLegend span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ln);background:var(--bg);border-radius:7px;padding:4px 7px;font-size:11px;color:var(--mu)}.planLegend i{display:inline-block;width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
#ov.on #sc{animation:planReveal .55s ease-out both}@keyframes planReveal{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
@media(max-width:640px){#towerBuild{padding:12px}.bt-floor{height:30px;font-size:11px}}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tb .on{background:var(--fg);color:var(--bg)}
.fan .mc{animation:fan .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*40ms);transform-origin:0 100%}
@keyframes fan{from{opacity:0;transform:rotate(-14deg) translateY(16px) scale(.85)}}
.cf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.cf input:not([type=color]),.cf select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;flex:1;min-width:0}
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px;max-height:260px;overflow:auto}.cl label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px}.cl label[hidden]{display:none}.cl img{width:24px;height:24px;image-rendering:pixelated}
#pl{width:100%;display:block;border-radius:10px;image-rendering:pixelated}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin-top:8px}.lg span{display:flex;gap:4px;align-items:center}.lg img{width:16px;height:16px;image-rendering:pixelated}

#sc{aspect-ratio:72/40;image-rendering:pixelated}#pl{background:#0d2a4a}#dg .cf input[type=checkbox]{width:auto;margin:0}.cf input,.cf select{margin:0}details.cf summary{cursor:pointer;color:var(--mu);font-size:14px}

body{background:radial-gradient(1100px 620px at 50% -8%,color-mix(in srgb,var(--ac,#7fb0ff) 18%,transparent),transparent),var(--bg);background-attachment:fixed}
main{max-width:1500px;padding:20px clamp(12px,3vw,40px)}
header{padding-inline:clamp(12px,3vw,40px)}#tabs{flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.mid{min-width:0}#sl{display:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:500}
.dm{margin:8px 0;font-size:13px}.dm i{display:block;height:6px;border-radius:9px;background:var(--ln);margin-top:4px;overflow:hidden}.dm u{display:block;height:100%;transition:width .6s}

#tw,#tw2{max-width:640px;margin:0 auto}#rl{display:none}#rl.on{display:block}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.rip{position:fixed;border:2px solid var(--fg);border-radius:50%;pointer-events:none;z-index:70;transform:translate(-50%,-50%);animation:rip .5s ease-out both}@keyframes rip{from{width:0;height:0;opacity:.6}to{width:90px;height:90px;opacity:0}}
.fl{overflow:hidden}.fl:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}.fl:hover:before{transform:translateX(120%);transition:transform .6s}
#pb.bump{animation:bump .5s}@keyframes bump{50%{filter:brightness(1.7) saturate(1.6)}}
.dgw{display:block}@media(min-width:900px){#dg{width:min(1080px,94vw)}.dgw{display:grid;grid-template-columns:1.05fr 1fr}.dl{position:sticky;top:0;align-self:start}}
.hint{text-align:center;padding:40px 0;color:var(--mu)}

body{background-attachment:scroll}
#tw .fl,#tw2 .fl{animation:none}
#tw.an .fl,#tw2.an .fl{animation:rise .45s both;animation-delay:calc(var(--k)*18ms)}
.fl.dn{box-shadow:0 0 14px var(--c)}
.amb{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

#trk.tense{box-shadow:0 0 0 2px #ffd25a,0 0 50px rgba(255,210,90,.4)}#trk.tense #mk{animation:mkp .45s infinite alternate}@keyframes mkp{to{box-shadow:0 0 30px #fff;width:5px}}

#ml .mc{cursor:pointer}#ml .mc.tap{animation:tap .3s}@keyframes tap{40%{transform:scale(.92)}}

.mile b{display:block;font-size:clamp(46px,13vw,130px);line-height:1;background:linear-gradient(180deg,#fff,var(--g,#ffd25a));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px var(--g,#ffd25a))}

.mile.m75 b{background-size:300% 100%;background-image:linear-gradient(100deg,#ff7ab8,#ffd25a,#7cf7ff,#b58aff,#ff7ab8);animation:m75 3s linear infinite,pop .8s both}@keyframes m75{to{background-position:300% 0}}

/* v9 */
@keyframes tabin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#st,#rt,#rl,#sm{animation:tabin .4s cubic-bezier(.2,.8,.3,1)}
.fl .ck{display:grid!important;position:relative;width:30px;height:30px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--fg) 50%,transparent);background:rgba(255,255,255,.35);color:transparent;font-size:15px;transition:transform .2s,border-color .2s,background .2s;animation:none}
.fl .ck:after{content:'';position:absolute;inset:-9px}
.fl:not(.dn) .ck:hover{border-color:var(--fg);background:rgba(255,255,255,.7);transform:scale(1.18)}
.fl.dn .ck{background:rgba(255,255,255,.92);color:#0a8a3a;border-color:transparent}
#tw .fl.flash .ck,#tw2 .fl.flash .ck{animation:ckpop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes ckpop{0%{transform:scale(.2) rotate(-90deg)}100%{transform:none}}
#tw .fl.flash,#tw2 .fl.flash{animation:rowflash .7s}
@keyframes rowflash{30%{filter:brightness(1.8) saturate(1.5);transform:scale(1.05)}100%{filter:none}}
.fl:active:not(.drag):not(.hold){transform:scale(.97)!important}
.fl.dn:before{animation:glint 6s ease-in-out infinite;animation-delay:calc(var(--k)*.4s)}
@keyframes glint{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.fl.hold{transform:scale(.96);transition:transform .38s;box-shadow:0 0 0 3px var(--c),0 8px 24px rgba(0,0,0,.25)}
.fl.drag{z-index:50;position:relative;background:var(--c)!important;color:var(--t)!important;box-shadow:0 30px 60px rgba(0,0,0,.45),0 12px 20px rgba(0,0,0,.3),0 0 0 4px #fff,0 0 44px var(--c)!important;transition:none!important;cursor:grabbing;animation:none!important;filter:saturate(1.25) brightness(1.06)}
.fl.drag:after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.55),transparent 45%);pointer-events:none}
body.dragging .fl:not(.drag){opacity:.72}body.dragging{cursor:grabbing}
